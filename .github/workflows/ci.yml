name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Byte-compile the package
        run: python -m compileall -q vllm_iluvatar

      - name: Reject internal hosts and private addresses
        run: |
          set -o pipefail
          pattern='[A-Za-z0-9_-]+\.iluvatar\.ai|[A-Za-z0-9._+-]+@iluvatar\.(com|ai)|\b10(\.[0-9]{1,3}){3}\b|\b192\.168(\.[0-9]{1,3}){2}\b|\b172\.(1[6-9]|2[0-9]|3[01])(\.[0-9]{1,3}){2}\b'
          if grep -rInE "$pattern" --exclude-dir=.git . ; then
            echo "Found an internal hostname or private address in the tree."
            exit 1
          fi
          echo "No internal hostnames or private addresses found."
